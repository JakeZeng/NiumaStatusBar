# Windows 上 NDK 27 的 ld.lld.exe 是真二进制，rustc 可直接通过 CreateProcess 调用。
# 绕过 clang driver 的 "Android target 自动加 crtbegin/crtend + 复杂 -L 解析"，更可控。
#
# rustflags 把 sysroot 和 NDK 库路径传给 lld：
#   - sysroot 让 lld 能找到 crtbegin/crtend 和 libc/libdl 等
#   - lib/clang/.../lib/linux/<arch> 包含 libunwind.a 和 libclang_rt.builtins-<arch>-android.a
#     （NDK driver 通常通过 clang driver 自动加，rustc 不走 driver 所以要手动 -L）

[target.aarch64-linux-android]
linker = "D:/Android/SDK/ndk/27.0.12077973/toolchains/llvm/prebuilt/windows-x86_64/bin/ld.lld.exe"
ar = "D:/Android/SDK/ndk/27.0.12077973/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"
rustflags = [
  "-Clink-arg=--sysroot=D:/Android/SDK/ndk/27.0.12077973/toolchains/llvm/prebuilt/windows-x86_64/sysroot",
  "-Clink-arg=-L", "-Clink-arg=D:/Android/SDK/ndk/27.0.12077973/toolchains/llvm/prebuilt/windows-x86_64/lib/clang/18/lib/linux/aarch64",
  "-Clink-arg=-L", "-Clink-arg=D:/Android/SDK/ndk/27.0.12077973/toolchains/llvm/prebuilt/windows-x86_64/sysroot/usr/lib/aarch64-linux-android/24",
  "-Clink-arg=-L", "-Clink-arg=D:/Android/SDK/ndk/27.0.12077973/toolchains/llvm/prebuilt/windows-x86_64/sysroot/usr/lib/aarch64-linux-android",
  "-Clink-arg=-L", "-Clink-arg=D:/Android/SDK/ndk/27.0.12077973/toolchains/llvm/prebuilt/windows-x86_64/sysroot/usr/lib",
]

[target.armv7-linux-androideabi]
linker = "D:/Android/SDK/ndk/27.0.12077973/toolchains/llvm/prebuilt/windows-x86_64/bin/ld.lld.exe"
ar = "D:/Android/SDK/ndk/27.0.12077973/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"
rustflags = [
  "-Clink-arg=--sysroot=D:/Android/SDK/ndk/27.0.12077973/toolchains/llvm/prebuilt/windows-x86_64/sysroot",
  "-Clink-arg=-L", "-Clink-arg=D:/Android/SDK/ndk/27.0.12077973/toolchains/llvm/prebuilt/windows-x86_64/lib/clang/18/lib/linux/arm",
]

[target.i686-linux-android]
linker = "D:/Android/SDK/ndk/27.0.12077973/toolchains/llvm/prebuilt/windows-x86_64/bin/ld.lld.exe"
ar = "D:/Android/SDK/ndk/27.0.12077973/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"
rustflags = [
  "-Clink-arg=--sysroot=D:/Android/SDK/ndk/27.0.12077973/toolchains/llvm/prebuilt/windows-x86_64/sysroot",
  "-Clink-arg=-L", "-Clink-arg=D:/Android/SDK/ndk/27.0.12077973/toolchains/llvm/prebuilt/windows-x86_64/lib/clang/18/lib/linux/i386",
]

[target.x86_64-linux-android]
linker = "D:/Android/SDK/ndk/27.0.12077973/toolchains/llvm/prebuilt/windows-x86_64/bin/ld.lld.exe"
ar = "D:/Android/SDK/ndk/27.0.12077973/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"
rustflags = [
  "-Clink-arg=--sysroot=D:/Android/SDK/ndk/27.0.12077973/toolchains/llvm/prebuilt/windows-x86_64/sysroot",
  "-Clink-arg=-L", "-Clink-arg=D:/Android/SDK/ndk/27.0.12077973/toolchains/llvm/prebuilt/windows-x86_64/lib/clang/18/lib/linux/x86_64",
]