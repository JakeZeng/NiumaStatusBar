<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>NiumaStatusBar — 粮草用量</title>
  <desc>数据脉冲徽章：圆角方块底 + 心电脉冲线，代表 AI 模型用量实时监控。</desc>
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <!-- 圆角方块底 -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#brandGrad)"/>
  <!-- 脉冲线：基线 → 峰值 → 基线 -->
  <path d="M 140 560 L 380 560 L 470 560 L 520 720 L 580 280 L 640 720 L 690 560 L 780 560 L 884 560"
        stroke="url(#pulseGrad)" stroke-width="72"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- 端点圆点 -->
  <circle cx="140" cy="560" r="36" fill="#ffffff"/>
  <circle cx="884" cy="560" r="36" fill="#ffffff"/>
</svg>