name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'trae/**'
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android.yml'

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      BASE_PATH: "/snap/bin:/home/runner/.local/bin:/opt/pipx_bin:/home/runner/.cargo/bin:/home/runner/.config/composer/vendor/bin:/usr/local/.ghcup/bin:/home/runner/.dotnet/tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

    steps:
      - name: DIAGNOSIS FIRST
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          echo "=== uname ==="
          uname -a
          echo "=== os-release ==="
          cat /etc/os-release
          echo "=== runner env ==="
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "GITHUB_ENV=$GITHUB_ENV"
          echo "=== PATH ==="
          echo "$PATH"
          echo "=== type ls tee head which head ==="
          type ls tee head which 2>&1
          echo "=== explicit /usr/bin/ls ==="
          /usr/bin/ls --version 2>&1 || echo "no /usr/bin/ls"
          echo "=== find /usr/bin coreutils ==="
          for cmd in ls tee head which cat echo sed awk grep; do
            p=$(command -v $cmd 2>/dev/null || echo MISSING)
            echo "  $cmd -> $p"
          done

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm (via corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          pnpm --version

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install JS deps
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build frontend
        run: pnpm build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        run: |
          set -e
          SDK="$ANDROID_SDK_ROOT"
          mkdir -p "$SDK/cmdline-tools"
          cd "$SDK/cmdline-tools"
          TOOLS_VER="11076708"
          URL="https://dl.google.com/android/repository/commandlinetools-linux-${TOOLS_VER}_latest.zip"
          echo "Downloading $URL"
          curl -fsSL -o tools.zip "$URL"
          unzip -q tools.zip
          rm tools.zip
          if [ -d "cmdline-tools" ]; then
            mv cmdline-tools latest
          fi
          ls -la latest/bin/ | head

      - name: Accept Android licenses
        run: |
          set -e
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null

      - name: Install Android SDK components
        run: |
          set -e
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Write local.properties (for Gradle)
        run: |
          mkdir -p src-tauri/gen/android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > src-tauri/gen/android/local.properties
          cat src-tauri/gen/android/local.properties

      - name: Cache Gradle / cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-android-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-

      - name: Install Rust stable + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Init Tauri Android project
        run: pnpm tauri android init --ci
        env:
          CI: 'true'

      - name: Ensure coreutils
        shell: bash
        run: |
          echo "PATH=$PATH"
          command -v ls || echo "no ls"
          command -v coreutils || echo "no coreutils"
          echo "--- restoring coreutils via apt if missing ---"
          apt-get update -y 2>&1 | tail -5 || true
          apt-get install -y coreutils 2>&1 | tail -5 || true
          ls --version
          echo "--- restoring PATH explicitly ---"
          echo 'export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"' >> $GITHUB_ENV

      - name: Runner info
        shell: bash
        run: |
          echo "uname=$(uname -a)"
          cat /etc/os-release 2>/dev/null || echo "no /etc/os-release"
          echo "runner name: $RUNNER_NAME"
          echo "runner os: $RUNNER_OS"
          echo "PATH=$PATH"

      - name: Tauri Android build (apk)
        shell: bash
        run: |
          echo "=== pnpm ==="
          pnpm --version
          echo "=== node ==="
          node --version
          echo "=== tauri.js --version ==="
          node node_modules/@tauri-apps/cli/tauri.js --version
          echo "=== build ==="
          node node_modules/@tauri-apps/cli/tauri.js android build --apk 2>&1 || true
          echo "--- done ---"
        env:
          CI: 'true'
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          PATH: ${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/latest/bin:${{ env.ANDROID_SDK_ROOT }}/platform-tools:${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin:${{ env.BASE_PATH }}
          RUST_BACKTRACE: 'full'

      - name: List APKs
        run: |
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload APK (universal release)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-universal
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error

      - name: Upload APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-arm64
          path: src-tauri/gen/android/app/build/outputs/apk/arm64-v8a/release/*.apk
          if-no-files-found: warn

      - name: Upload APK (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-armv7
          path: src-tauri/gen/android/app/build/outputs/apk/armeabi-v7a/release/*.apk
          if-no-files-found: warn
