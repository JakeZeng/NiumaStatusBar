name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'trae/**'
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android.yml'

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      BASE_PATH: "/snap/bin:/home/runner/.local/bin:/opt/pipx_bin:/home/runner/.cargo/bin:/home/runner/.config/composer/vendor/bin:/usr/local/.ghcup/bin:/home/runner/.dotnet/tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

    steps:
      - name: DIAGNOSIS FIRST
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          echo "=== uname ==="
          uname -a
          echo "=== runner env ==="
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "=== PATH ==="
          echo "$PATH"
          echo "=== coreutils check ==="
          for cmd in ls tee head which cat echo sed awk grep curl unzip; do
            p=$(command -v $cmd 2>/dev/null || echo MISSING)
            echo "  $cmd -> $p"
          done

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm (via corepack)
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          pnpm --version

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install JS deps
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build frontend
        run: pnpm build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        run: |
          set -e
          SDK="$ANDROID_SDK_ROOT"
          mkdir -p "$SDK/cmdline-tools"
          cd "$SDK/cmdline-tools"
          TOOLS_VER="11076708"
          URL="https://dl.google.com/android/repository/commandlinetools-linux-${TOOLS_VER}_latest.zip"
          echo "Downloading $URL"
          curl -fsSL -o tools.zip "$URL"
          unzip -q tools.zip
          rm tools.zip
          if [ -d "cmdline-tools" ]; then
            mv cmdline-tools latest
          fi
          ls -la latest/bin/ | head

      - name: Accept Android licenses
        run: |
          set -e
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null

      - name: Install Android SDK components
        run: |
          set -e
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Write local.properties (for Gradle)
        run: |
          mkdir -p src-tauri/gen/android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > src-tauri/gen/android/local.properties
          cat src-tauri/gen/android/local.properties

      - name: Install Rust stable + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Init Tauri Android project (force regenerate)
        run: |
          set -e
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_SDK_ROOT="$ANDROID_SDK_ROOT"
          export NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          cd src-tauri
          rm -rf gen/android
          cd ..
          pnpm tauri android init --ci

      - name: Ensure tauri.settings.gradle / tauri.build.gradle.kts exist
        run: |
          set -e
          # These two files are .gitignored — they're generated by tauri-cli but the
          # committed scaffold doesn't include them, and 'tauri android init' in
          # current tauri-cli 2.11.x doesn't write them either. They're required
          # by settings.gradle / app/build.gradle.kts via 'apply from' / 'apply(from)'.
          # In the official template tauri.settings.gradle is empty; same for the build one.
          ROOT=src-tauri/gen/android
          if [ ! -f "$ROOT/tauri.settings.gradle" ]; then
            echo "(creating empty $ROOT/tauri.settings.gradle)"
            : > "$ROOT/tauri.settings.gradle"
          fi
          if [ ! -f "$ROOT/app/tauri.build.gradle.kts" ]; then
            echo "(creating empty $ROOT/app/tauri.build.gradle.kts)"
            : > "$ROOT/app/tauri.build.gradle.kts"
          fi
          echo "--- final state ---"
          ls -la "$ROOT/tauri.settings.gradle" "$ROOT/app/tauri.build.gradle.kts"

      - name: Patch BuildTask to bypass tauri-cli android-studio-script
        run: |
          set -e
          # tauri-cli 2.11.x's 'android-studio-script' panics in release builds:
          #   "failed to read missing addr file /tmp/<id>-server-addr"
          # 'tauri android init' just regenerated the original BuildTask.kt, so we
          # overwrite it again to call cargo directly.
          BUILDTASK=src-tauri/gen/android/buildSrc/src/main/java/com/aimonitor/app/kotlin/BuildTask.kt
          cat > "$BUILDTASK" <<'EOF'
          import java.io.File
          import org.apache.tools.ant.taskdefs.condition.Os
          import org.gradle.api.DefaultTask
          import org.gradle.api.GradleException
          import org.gradle.api.logging.LogLevel
          import org.gradle.api.tasks.Input
          import org.gradle.api.tasks.TaskAction

          open class BuildTask : DefaultTask() {
              @Input
              var rootDirRel: String? = null
              @Input
              var target: String? = null
              @Input
              var release: Boolean? = null

              @TaskAction
              fun assemble() {
                  val rootDirRel = rootDirRel ?: throw GradleException("rootDirRel cannot be null")
                  val target = target ?: throw GradleException("target cannot be null")
                  val release = release ?: throw GradleException("release cannot be null")
                  val rootDir = File(project.projectDir, rootDirRel)

                  val cargo = if (Os.isFamily(Os.FAMILY_WINDOWS)) "cargo.exe" else "cargo"
                  val profile = if (release) "release" else "debug"
                  // tauri-cli's RustPlugin passes short names ('aarch64', 'armv7', etc.)
                  // Expand to full rustc triples for cargo --target.
                  val targetTriple = when (target) {
                      "aarch64" -> "aarch64-linux-android"
                      "armv7" -> "armv7-linux-androideabi"
                      "i686" -> "i686-linux-android"
                      "x86_64" -> "x86_64-linux-android"
                      else -> target
                  }
                  // Run cargo, capture full output so linker errors are visible
                  // cargo runs in the Tauri workspace root: ../.. from src-tauri/gen/android
                  // Use absolute paths to avoid cwd ambiguity in gradle exec context
                  val cargoRoot = File(project.projectDir, rootDirRel).absoluteFile
                  val cargoLog = File(cargoRoot, "target/cargo-build-$targetTriple-$profile.log")
                  cargoLog.parentFile.mkdirs()
                  // Point cargo to NDK clang via .cargo/config.toml in the CARGO ROOT
                  // (cargo only reads target-specific linker settings from config files,
                  // and it reads from the workspace root, not the cwd)
                  val ndkPath = System.getenv("ANDROID_NDK_ROOT") ?: 
                      System.getenv("ANDROID_SDK_ROOT")?.let { sdk -> "$sdk/ndk/27.0.12077973" } ?: ""
                  if (ndkPath.isNotEmpty()) {
                      val cargoDir = File(cargoRoot, ".cargo")
                      cargoDir.mkdirs()
                      // NDK clang filenames differ from rust target triples for armv7:
                      // rust: armv7-linux-androideabi -> NDK: armv7a-linux-androideabi
                      val clangTriple = when (targetTriple) {
                          "armv7-linux-androideabi" -> "armv7a-linux-androideabi"
                          else -> targetTriple
                      }
                      // Append to existing config.toml (multiple targets run in parallel)
                      val configFile = File(cargoDir, "config.toml")
                      val existing = if (configFile.exists()) configFile.readText() else ""
                      val newSection = """
                          [target.${targetTriple}]
                          linker = "${ndkPath}/toolchains/llvm/prebuilt/linux-x86_64/bin/${clangTriple}24-clang"
                          ar = "${ndkPath}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
                      """.trimIndent()
                      // Only write if this target isn't already in the config
                      if (!existing.contains("[target.${targetTriple}]")) {
                          configFile.writeText(existing.trimIndent() + "\n" + newSection)
                      }
                  }
                  // Capture stdout/stderr in-memory (FileOutputStream to same file is unreliable)
                  val stdout = java.io.ByteArrayOutputStream()
                  val stderr = java.io.ByteArrayOutputStream()
                  val cargoResult = project.exec {
                      workingDir(cargoRoot)
                      executable(cargo)
                      args("build", "--target", targetTriple, "--profile", profile)
                      args("--verbose")  // surface linker commands and full error context
                      environment("CARGO_TERM_COLOR", "never")
                      environment("ANDROID_NDK_ROOT", ndkPath)
                      isIgnoreExitValue = true
                      standardOutput = stdout
                      errorOutput = stderr
                  }
                  // Persist to log file for debugging
                  cargoLog.writeText(stdout.toString() + stderr.toString())
                  if (cargoResult.exitValue != 0) {
                      val combined = (stdout.toString() + stderr.toString()).lines()
                      val tail = if (combined.size > 200) combined.takeLast(200) else combined
                      val configPath = File(File(cargoRoot, ".cargo"), "config.toml")
                      val configText = if (configPath.exists()) configPath.readText() else "(no config.toml)"
                      throw GradleException("cargo build failed for $targetTriple/$profile (exit ${cargoResult.exitValue}).\n" +
                          "config.toml:\n$configText\n" +
                          "Last 200 cargo log lines:\n${tail.joinToString("\n")}")
                  }

                  // soName: read from Cargo.toml to get the actual lib name
                  // (it's NOT lib<rootDir.name>.so — that was wrong)
                  val cargoToml = File(cargoRoot, "Cargo.toml")
                  val soName = if (cargoToml.exists()) {
                      val tomlText = cargoToml.readText()
                      val nameMatch = Regex("""name\s*=\s*"([^"]+)"""").find(tomlText)
                      "lib${nameMatch?.groupValues?.get(1) ?: "app"}.so"
                  } else {
                      "libapp.so"
                  }
                  val abi = when (targetTriple) {
                      "aarch64-linux-android" -> "arm64-v8a"
                      "armv7-linux-androideabi" -> "armeabi-v7a"
                      "i686-linux-android" -> "x86"
                      "x86_64-linux-android" -> "x86_64"
                      else -> targetTriple
                  }
                  val targetDir = File(cargoRoot, "target/$targetTriple/$profile")
                  val srcSo = File(targetDir, soName)
                  val fallback = File(targetDir, "libapp.so")
                  val candidates = targetDir.listFiles()?.filter { 
                      it.name.endsWith(".so") && it.name.startsWith("lib")
                  } ?: emptyList()
                  val srcFinal = when {
                      srcSo.exists() -> srcSo
                      fallback.exists() -> fallback
                      candidates.isNotEmpty() -> candidates.first().also {
                          project.logger.lifecycle("Found .so via glob: $it")
                      }
                      else -> throw GradleException("Built .so not found in $targetDir (tried: $soName, libapp.so, candidates: $candidates)")
                  }
                  val dstDir = File(project.projectDir, "src/main/jniLibs/$abi")
                  if (!dstDir.exists()) dstDir.mkdirs()
                  val dstSo = File(dstDir, soName)
                  srcFinal.copyTo(dstSo, overwrite = true)
                  project.logger.lifecycle("Copied $srcFinal -> $dstSo")
              }
          }
          EOF
          echo "--- patched BuildTask.kt ---"
          head -10 "$BUILDTASK"
          # Nuke buildSrc compile cache so our patched task is recompiled
          rm -rf .gradle buildSrc/build buildSrc/.gradle 2>/dev/null || true
          # Also bust the parent project's caches that might reference the old BuildTask
          rm -rf /home/runner/.gradle/caches/build-cache-* 2>/dev/null || true
          # Remove any stale .cargo/config (non-toml) that might override our new config.toml
          rm -f src-tauri/.cargo/config 2>/dev/null || true

      - name: Pre-download Gradle 8.14.4 + point wrapper to local file
        shell: bash
        run: |
          set -e
          export PATH="$BASE_PATH"
          GRADLE_VER="8.14.4"
          ZIP="/tmp/gradle-${GRADLE_VER}-bin.zip"
          GRADLE_HOME_DIR="/opt/gradle"
          if [ -x "$GRADLE_HOME_DIR/bin/gradle" ]; then
            echo "Gradle already installed at $GRADLE_HOME_DIR"
          else
            echo "Downloading gradle..."
            OK=0
            for URL in \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" \
              "https://github.com/gradle/gradle/releases/download/v${GRADLE_VER}/gradle-${GRADLE_VER}-bin.zip" \
              "https://mirrors.tuna.tsinghua.edu.cn/gradle/gradle-${GRADLE_VER}-bin.zip" \
              "https://mirrors.huaweicloud.com/gradle/gradle-${GRADLE_VER}-bin.zip" \
              "https://mirrors.cloud.tencent.com/gradle/gradle-${GRADLE_VER}-bin.zip"; do
              echo "Trying: $URL"
              if curl -fSL --connect-timeout 20 --max-time 900 -o "$ZIP" "$URL"; then
                if [ -s "$ZIP" ]; then
                  OK=1
                  echo "  -> OK"
                  break
                fi
              fi
              rm -f "$ZIP"
            done
            if [ "$OK" != "1" ]; then
              echo "FATAL: All gradle download URLs failed"
              exit 1
            fi
            echo "Extracting to $GRADLE_HOME_DIR ..."
            mkdir -p "$GRADLE_HOME_DIR"
            unzip -qo "$ZIP" -d /opt/
            if [ -d "/opt/gradle-${GRADLE_VER}" ]; then
              cp -a "/opt/gradle-${GRADLE_VER}/." "$GRADLE_HOME_DIR/"
              rm -rf "/opt/gradle-${GRADLE_VER}"
            fi
            # keep the zip! we'll point the wrapper to it
            chmod +x "$GRADLE_HOME_DIR/bin/gradle" || true
            echo "Gradle installed:"
            "$GRADLE_HOME_DIR/bin/gradle" --version
          fi

          # Now repoint the wrapper to the local zip so `gradlew` doesn't try to download
          WRAPPER_PROPS="src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$ZIP" ]; then
            sed -i "s|^distributionUrl=.*|distributionUrl=file\\:${ZIP}|" "$WRAPPER_PROPS"
            echo "--- updated wrapper ---"
            cat "$WRAPPER_PROPS"
          else
            echo "WARN: zip missing at $ZIP, wrapper will try network"
          fi

          # Also pre-seed the wrapper cache so gradlew doesn't even re-check
          # Wrapper uses sha256 of distributionUrl as cache key
          WRAPPER_HASH=$(printf '%s' "file:${ZIP}" | sha256sum | cut -c1-30)
          CACHE_DIR="$HOME/.gradle/wrapper/dists/gradle-${GRADLE_VER}-bin/${WRAPPER_HASH}"
          echo "Wrapper cache dir would be: $CACHE_DIR"
          # Don't try to manually populate the cache; file:// url will be used directly

          echo "GRADLE_HOME=$GRADLE_HOME_DIR" >> $GITHUB_ENV
          echo "GRADLE_ZIP=$ZIP" >> $GITHUB_ENV

      - name: Cache Gradle / cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-android-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-

      - name: Locate pnpm bin for gradle rust plugin
        id: pnpm
        shell: bash
        run: |
          set -e
          for p in \
            "$HOME/.cache/node/corepack/v1/pnpm"/*/bin \
            "$HOME/.local/share/pnpm" \
            "/usr/local/bin" \
            "/opt/pnpm/bin"; do
            if [ -x "$p/pnpm" ]; then
              echo "PNPM_BIN=$p" >> $GITHUB_OUTPUT
              echo "Found pnpm at: $p"
              exit 0
            fi
            if [ -x "$p/pnpm.cjs" ]; then
              echo "PNPM_BIN=$p" >> $GITHUB_OUTPUT
              echo "Found pnpm.cjs at: $p"
              exit 0
            fi
          done
          echo "FATAL: pnpm not found"
          exit 1

      - name: Tauri Android build (apk) — direct gradle
        shell: bash
        run: |
          set -e
          PNPM_BIN="${{ steps.pnpm.outputs.PNPM_BIN }}"
          export PATH="$PNPM_BIN:/opt/gradle/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin:$BASE_PATH"
          echo "=== versions ==="
          # If corepack installed pnpm.cjs but no pnpm shim, create one on the fly
          if ! command -v pnpm >/dev/null 2>&1 && [ -x "$PNPM_BIN/pnpm.cjs" ]; then
            ln -sf "$PNPM_BIN/pnpm.cjs" "$PNPM_BIN/pnpm"
          fi
          pnpm --version
          node --version
          /opt/gradle/bin/gradle --version
          echo "=== current wrapper props ==="
          cat src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
          echo "=== running gradle assembleRelease directly (this also compiles rust via 'rust' gradle plugin) ==="
          cd src-tauri/gen/android
          /opt/gradle/bin/gradle assembleRelease --no-daemon --stacktrace 2>&1 | tail -300
        env:
          CI: 'true'
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          GRADLE_HOME: /opt/gradle
          RUST_BACKTRACE: 'full'

      - name: Locate APKs (debug info)
        shell: bash
        run: |
          echo "=== Searching for APKs ==="
          find src-tauri/gen/android -name "*.apk" -type f 2>&1 | head -50 || echo "find failed"
          echo "=== build/outputs tree ==="
          ls -laR src-tauri/gen/android/app/build/outputs 2>&1 | head -80 || echo "no outputs dir"

      - name: Upload APK (universal release)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-universal
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: warn

      - name: Upload APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-arm64
          path: src-tauri/gen/android/app/build/outputs/apk/arm64-v8a/release/*.apk
          if-no-files-found: warn

      - name: Upload APK (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-armv7
          path: src-tauri/gen/android/app/build/outputs/apk/armeabi-v7a/release/*.apk
          if-no-files-found: warn

      - name: Upload APK (debug, fallback)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-universal
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: warn

      - name: Upload APK (all found)
        uses: actions/upload-artifact@v4
        with:
          name: app-all-apks
          path: src-tauri/gen/android/**/*.apk
          if-no-files-found: warn

      - name: Upload cargo build log (for debugging linker errors)
        uses: actions/upload-artifact@v4
        with:
          name: cargo-build-log
          path: src-tauri/target/cargo-build-*.log
          if-no-files-found: ignore
